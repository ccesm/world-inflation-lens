name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Check official data before deploying
        type: boolean
        default: true
  schedule:
    - cron: '23 14 * * 1'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        with:
          python-version: '3.12'
      - name: Install reviewed workbook readers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python -m pip install -r scripts/requirements-external.txt
      - name: Refresh official data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: npm run data:refresh
      - run: npm run build
      - run: npm run verify
      - name: Save validated snapshots and revision summary
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/external/gpr.json data/external/gscpi.json data/external/fao-food.json data/inflation/fred.json data/inflation/drivers.json data/inflation/monitor.json data/inflation/worldbank.json data/updates/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated inflation snapshots'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger another push workflow. Deploy this build here.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
