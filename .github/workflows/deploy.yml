name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Check official data before deploying
        type: boolean
        default: true
  schedule:
    - cron: '0 8 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      snapshot_commit: ${{ steps.snapshot.outputs.commit }}
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        with:
          python-version: '3.12'
      - name: Install reviewed workbook readers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python -m pip install -r scripts/requirements-external.txt
      - name: Refresh official data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: npm run data:refresh
      - run: npm run build
      - run: npm run verify
      - name: Save validated snapshots and revision summary
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/digital-money/bank-deposits.json data/productivity/series.json data/external/gpr.json data/external/gscpi.json data/external/fao-food.json data/inflation/fred.json data/inflation/drivers.json data/inflation/monitor.json data/inflation/worldbank.json data/updates/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated inflation snapshots'
            git push origin HEAD:main
          fi
      - name: Record exact snapshot commit
        id: snapshot
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger another push workflow. Deploy this build here.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Daily email summary
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh))
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.snapshot_commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send result after update and deployment
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: node scripts/notify.mjs
