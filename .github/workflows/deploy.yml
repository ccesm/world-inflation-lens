name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh:
        description: Check official data before deploying
        type: boolean
        default: true
  schedule:
    - cron: '40 17 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      snapshot_commit: ${{ steps.snapshot.outputs.commit }}
      code_commit: ${{ steps.context.outputs.code_commit }}
      app_version: ${{ steps.context.outputs.app_version }}
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Record application and code identity
        id: context
        run: node scripts/status-context.mjs
      - uses: actions/setup-python@v5
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        with:
          python-version: '3.12'
      - name: Install reviewed workbook readers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python -m pip install -r scripts/requirements-external.txt
      - name: Refresh official data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: npm run data:refresh
      - name: Save validated snapshots and revision summary
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/international-dollar data/digital-money/bank-deposits.json data/productivity/series.json data/external/gpr.json data/external/gscpi.json data/external/fao-food.json data/inflation/fred.json data/inflation/drivers.json data/inflation/monitor.json data/inflation/worldbank.json data/updates/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated inflation snapshots'
            git push origin HEAD:main
          fi
      - name: Record exact snapshot commit
        id: snapshot
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/status-context.mjs
      - run: npm run build
      - run: npm run verify
      # GITHUB_TOKEN pushes do not trigger another push workflow. Deploy this build here.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Preserve safe data-check report even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-check-status
          path: .refresh/check.json
          include-hidden-files: true
          if-no-files-found: ignore
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      deployed_at: ${{ steps.outcome.outputs.deployed_at }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record completed successful deployment
        id: outcome
        run: echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  notify:
    name: Daily email summary
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh))
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      notification_result: ${{ steps.mail.outputs.notification_result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.snapshot_commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send result after update and deployment
        id: mail
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: node scripts/notify.mjs

  status:
    name: Publish independent system status
    if: always() && github.ref == 'refs/heads/main'
    needs: [build, deploy, notify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.snapshot_commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read safe check report if the refresh ran
        id: report
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: data-check-status
          path: .refresh
      - name: Publish safe outcomes after deployment and notification finish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.build.outputs.app_version }}
          CODE_COMMIT: ${{ needs.build.outputs.code_commit || github.sha }}
          SNAPSHOT_COMMIT: ${{ needs.build.outputs.snapshot_commit }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DEPLOYED_AT: ${{ needs.deploy.outputs.deployed_at }}
          NOTIFICATION_RESULT: ${{ needs.notify.outputs.notification_result }}
          REFRESH_REQUESTED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
        run: node scripts/publish-system-status.mjs
